<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyn CRM - Main Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <nav class="bg-blue-600 text-white p-4 shadow flex justify-between items-center">
        <h1 class="text-xl font-bold">Wyn CRM Dashboard</h1>
        <div class="space-x-4 flex items-center">
            <!-- Link to Separate Client Directory Dashboard -->
            <a href="clients.html" class="bg-indigo-600 px-3 py-1.5 rounded text-sm hover:bg-indigo-700 transition">Client Directory</a>
            <span id="userDisplay" class="text-sm font-medium"></span>
            <button id="logoutBtn" class="bg-red-600 px-3 py-1.5 rounded text-sm hover:bg-red-700 transition">Logout</button>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left / Center Panel: CRM Tools & Consent Form -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Consent Form Email Sender -->
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-gray-800">Send Client Consent Form</h2>
                    <span class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">
                        Total Sent: <span id="consentCountDisplay">0</span>
                    </span>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Client Name</label>
                        <input type="text" id="clientName" placeholder="John Doe" class="mt-1 w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Client Email</label>
                        <input type="email" id="clientEmail" placeholder="client@example.com" class="mt-1 w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button id="sendEmailBtn" class="bg-blue-600 text-white w-full py-2 rounded hover:bg-blue-700 transition font-medium">
                        Send Consent Form to Client Email
                    </button>
                </div>
            </div>

            <!-- Calendar Container (Adjustable Height & Half-Length Control Buttons) -->
            <div class="bg-white p-6 rounded-lg shadow">
                <div class="flex gap-2 mb-4">
                    <button class="w-1/2 bg-blue-600 text-white py-2 rounded font-medium">DC Benson</button>
                    <button class="w-1/2 bg-green-600 text-white py-2 rounded font-medium">ACA</button>
                </div>
                
                <!-- Adjustable calendar length container using resize-y -->
                <div id="calendarContainer" class="resize-y overflow-auto border border-gray-300 p-4 rounded-lg min-h-[250px] max-h-[600px] w-full bg-gray-50">
                    <h3 class="font-bold text-gray-700 mb-2">Shared Appointments</h3>
                    <div id="appointmentsList" class="space-y-2 text-sm text-gray-600">
                        <!-- Appointments load here -->
                    </div>
                </div>
            </div>

        </div>

        <!-- Right Panel: Live Office Chat -->
        <div class="bg-white p-6 rounded-lg shadow flex flex-col h-[600px]">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Office Live Chat</h2>
            <div id="chatBox" class="flex-1 border border-gray-300 rounded p-3 overflow-y-auto mb-4 bg-gray-50 text-sm whitespace-pre-line"></div>
            <div class="flex gap-2">
                <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 border border-gray-300 rounded p-2 focus:ring-2 focus:ring-blue-500 text-sm">
                <button id="sendChatBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition text-sm">Send</button>
            </div>
        </div>

    </main>

    <!-- Frontend Script Logic -->
    <script>
        const socket = io();

        // Check active session & username
        async function checkSession() {
            const res = await fetch('/api/session');
            const data = await res.json();
            if (data.loggedIn) {
                document.getElementById('userDisplay').innerText = `User: ${data.user.username} (${data.user.role})`;
            } else {
                window.location.href = 'login.html'; // Redirect to login if not signed in
            }
        }
        checkSession();

        // Logout listener
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' });
            window.location.href = 'login.html';
        });

        // Consent Counter Fetcher
        async function updateConsentCounter() {
            try {
                const res = await fetch('/api/consent-count');
                const data = await res.json();
                document.getElementById('consentCountDisplay').innerText = data.totalCount;
            } catch (err) {
                console.error('Error fetching count:', err);
            }
        }
        updateConsentCounter();

        // Send Email Button with Duplicate Confirmation Prompt
        document.getElementById('sendEmailBtn').addEventListener('click', async () => {
            await sendConsentEmail(false);
        });

        async function sendConsentEmail(forceResend) {
            const clientData = {
                name: document.getElementById('clientName').value,
                email: document.getElementById('clientEmail').value,
                message: "Here is your completed consent form copy.",
                forceResend: forceResend
            };

            try {
                const response = await fetch('/api/contact-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(clientData)
                });

                const result = await response.json();
                
                if (result.success) {
                    alert('Consent form successfully sent! Total sent: ' + result.totalCount);
                    updateConsentCounter();
                } else if (result.needsConfirmation) {
                    const userConfirmed = confirm(result.message);
                    if (userConfirmed) {
                        await sendConsentEmail(true); // Resend forced
                    }
                } else {
                    alert(result.message || 'Error sending form.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while sending the email.');
            }
        }

        // Chat functionality
        const chatBox = document.getElementById('chatBox');
        const chatInput = document.getElementById('chatInput');

        socket.on('chat-history', (history) => {
            chatBox.innerText = history;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        socket.on('chat-message', (data) => {
            chatBox.innerText += `${data.user}: ${data.text}\n`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        document.getElementById('sendChatBtn').addEventListener('click', async () => {
            const text = chatInput.value.trim();
            if (!text) return;
            const res = await fetch('/api/session');
            const data = await res.json();
            const username = data.loggedIn ? data.user.username : 'Guest';
            
            socket.emit('chat-message', { user: username, text: text });
            chatInput.value = '';
        });
    </script>
</body>
</html>
